<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Acordar Sem Erro</title>
    <meta name="description" content="Assistente de rotina matinal para mães." />
    <meta name="theme-color" content="#FDFCF8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue: '#E3EBF3', // Mais desaturado/pálido (Morning Sky)
                beige: '#FDFCF8', // Mantido (Base clara)
                dark: '#374151', // Charcoal levemente mais suave
                gray: '#9CA3AF',
                accent: '#EBD198', // Dourado Suave (Gold)
                softBlue: '#EFF4F9', // Fundo muito sutil
                warmBeige: '#FAF9F6',
                gold: '#F2D696', // Novo Gold para destaques
                goldLight: '#FEF3C7',
                greenSoft: '#D1FAE5'
              }
            },
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
              serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 1s ease-out forwards',
              'fade-out': 'fadeOut 0.8s ease-in forwards',
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'rise': 'rise 1.5s ease-out forwards',
              'shine': 'shine 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(4px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0' },
              },
              rise: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              shine: {
                '0%, 100%': { opacity: '0.8' },
                '50%': { opacity: '1' },
              }
            },
            boxShadow: {
              'soft': '0 4px 30px -4px rgba(55, 65, 81, 0.04)',
              'glow': '0 0 20px rgba(242, 214, 150, 0.4)', // Golden glow
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FDFCF8;
        -webkit-font-smoothing: antialiased;
      }
      /* Hide scrollbar for clean UI in horizontal scrolls */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Subtle Grain Texture */
      .bg-grain {
        position: relative;
      }
      .bg-grain::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
        opacity: 0.035;
        pointer-events: none;
        z-index: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",

  }
}
</script>
